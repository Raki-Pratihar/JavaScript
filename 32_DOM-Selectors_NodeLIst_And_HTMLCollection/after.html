<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before</title>
    <style>
        .bg-black {
            background-color: #212121;
            color: #fff;
        }
    </style>
</head>

<body class="bg-black">
    <div>
        <h1 id="title" class="heading">Document Object Model <span style="display: none;">test text</span> </h1>
        <p>Lorem ipsum dolor sit amet.</p>

        <ul>
            <li>oen</li>
            <li>two</li>
            <li>three</li>
        </ul>

        <h2 class="heading-2">Lorem ipsum dolor sit amet.</h2>
        <h2 class="heading-2">Lorem ipsum dolor sit amet.</h2>
        <h2 class="heading-2">Lorem ipsum dolor sit amet.</h2>
        <h2 class="heading-2">Lorem ipsum dolor sit amet.</h2>
    </div>

</body>
<script>
    // 32. DOM Selectors , NodeList And HTNLCollection

    // 1️⃣ Select an elment from HTML using getElementById()
    console.log(document.getElementById('title'));


    // 2️⃣ Find attribute from selected element   
    console.log(document.getElementById('title').id);
    console.log(document.getElementById('title').className);


    // 3️⃣ Find and change  attribute from selected element using getAttribute() and SsetAttribute()
    console.log(document.getElementById('title').getAttribute('id'));
    console.log(document.getElementById('title').getAttribute('class'));
    document.getElementById('title').setAttribute('class', 'main_heading')


    // 4️⃣ Store the selected element in a variable
    const title = document.getElementById('title')
    console.log(title);


    // 5️⃣ Change style of the selected item 
    title.style.backgroundColor = 'green'
    title.style.padding = "15px"
    title.style.borderRadius = "15px"


    // 6️⃣ textContent vs innerHTML vs innerText
    /*
    Feature             textContent     innerHTML     innerText 
    
    1. Returns HTML     ✅             ❌            ✅
    tags
    
    2. Returns HTML     ❌              ✅           ❌
    tags
    
    3. Recognises HTML  ❌              ✅           ❌
    tags when setting
    
    4. Includes hidden  ✅              ❌           ❌
    text
    
    5. Considers CSS    ❌              ❌           ✅ 
    styling
    
    6. Performance      Fast             Depends      Depends
    
    */
    console.log(title.textContent);
    console.log(title.innerHTML);
    console.log(title.innerText);


    // 7️⃣ Select elements using querySelector()
    console.log(document.querySelector('h1'));
    console.log(document.querySelector('#title'));
    console.log(document.querySelector('.main_heading'));


    // 8️⃣ DOM manupulation using querySelector()
    const myul = document.querySelector('ul')  // only give first ul
    console.log(myul.querySelector('li'));  // only give first ul 
    const firstli = myul.querySelector('li')
    firstli.style.backgroundColor = 'green'
    firstli.style.padding = '10px'
    firstli.textContent = "one green"


    // 9️⃣ querySelectorAll()
    /*♦️Important Points: 
    🌟Selects all matching elements.
    🌟Accepts CSS selectors.
    🌟Returns a NodeList.
    🌟Returns an empty NodeList if no matching element is found.
    🌟You can use forEach() to iterate through the selected elements. 
    
    ♦️ querySelector() vs querySelectorAll()
    
    querySelector()                     querySelectorAll()
    
    Selects first matching element      Selects all matching elements
    Returns one element                 Returns a NodeList
    Returns null if not found           Returns an empty NodeList if not found
    */
    console.log(document.querySelectorAll('li'));
    const liNodelist = document.querySelectorAll('li')

    console.log(liNodelist[0]);  // select any list
    console.log(liNodelist[1]);
    console.log(liNodelist[2]);

    liNodelist[1].style.backgroundColor = 'brown'
    liNodelist[1].style.padding = '10px'
    liNodelist[1].textContent = "two brown"


    // 1️⃣0️⃣ forEach loop using querySelectorAll()
    const myH2 = document.querySelectorAll('h2')
    myH2.forEach((h) => {
        h.style.color = 'green'
    })


    // 1️⃣1️⃣ getElementByClassName and HTML collection 
    /*Important Points:
    1. Selects all elements with the specified class.
    2. Does not require a . before the class name.
    3. Returns an HTMLCollection.
    4. Returns an empty HTMLCollection if no matching 5.elements exist.
    6. HTMLCollection is live, meaning it automatically updates when matching elements are added or removed.*/

    const colH2 = document.getElementsByClassName('heading-2')
    console.log(colH2);

    //⭐ HTML Collection don't have forEach like Nodelist


    // 1️⃣2️⃣ Convert Array from nodelist and htmlcollection
    /* We can convert any Nodelist or HTML collection into an array and can use all array methodes*/

    const newArr = Array.from(colH2)
    console.log(newArr);

</script>

</html>
