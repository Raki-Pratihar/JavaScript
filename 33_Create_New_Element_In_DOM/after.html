<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add element in DOM</title>
</head>

<body style="background-color: #212121; color: #fff;">
    <div class="parent">
        <div class="child">child-1</div>
        <div class="child">child-2</div>
        <div class="child">child-3</div>
        <div class="child">child-4</div>
    </div>
</body>
<script>

    // 33. Create New Element in DOM      
    const parent = document.querySelector('.parent')
    console.log(parent);


    // 1️⃣ .children give html collection of any parent 
    console.log(parent.children);
    console.log(parent.children[0]);
    console.log(parent.children[1]);
    console.log(parent.children[2].innerHTML);


    for (let i = 0; i < parent.children.length; i++) {
        console.log(parent.children[i].innerHTML);
    }


// 2️⃣ change style using .children 
    parent.children[0].style.color = 'green'


    // 3️⃣ .firstElementChild and .lastElementChild 
    console.log(parent.firstElementChild);
    console.log(parent.lastElementChild);


    // 4️⃣ .parentElement and .nextElenentSibling
    const childOne = document.querySelector('.child')
    console.log(childOne);
    console.log(childOne.parentElement);
    console.log(childOne.nextElementSibling);

// 5️⃣ .childNodes
    console.log("NODES:", parent.childNodes);


// 7️⃣ Add an element in DOM
    const H1 = document.createElement('h1')
    console.log(H1);
    H1.className = "main_heading"
    H1.id = Math.round(Math.random() * 10 + 1)
    H1.setAttribute("title", "generated title")
    H1.style.backgroundColor = 'green'
    H1.style.padding = '12px'
    //H1.innerText= "Add a Heading"
    const addTextToH1 = document.createTextNode("Add a Heading")
    H1.appendChild(addTextToH1)
    document.body.appendChild(H1)

</script>

</html>
